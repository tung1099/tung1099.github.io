<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quản trị — Blog cá nhân</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b45309'/%3E%3Ctext x='16' y='24' font-size='21' font-family='Georgia,serif' fill='%23fdfcfa' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   BẢNG MÀU — giữ giống hệt index.html để xem trước cho đúng.
   Sửa màu thì sửa cả hai file.
   ============================================================ */
:root{
  --bg:#fdfcfa; --surface:#ffffff; --surface2:#f4efe6; --text:#1c1a17; --muted:#6b6459;
  --line:#e8e3da; --accent:#b45309; --accent-bg:#fef3e2; --code-bg:#fbf8f2;
  --shadow:0 1px 3px rgba(28,26,23,.05);
  --danger:#b91c1c; --danger-bg:#fdeceb; --ok:#4d7c0f;
  --c-key:#9d0006; --c-str:#79740e; --c-com:#928374; --c-num:#8f3f71;
  --c-fn:#076678; --c-type:#b57614; --c-attr:#af3a03;
}
html[data-theme="dark"]{
  --bg:#16150f; --surface:#1f1e18; --surface2:#2a2820; --text:#ece7dd; --muted:#9c948a;
  --line:#302e26; --accent:#f0a952; --accent-bg:#2a2318; --code-bg:#1b1a14;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --danger:#fb4934; --danger-bg:#2e1a15; --ok:#b8bb26;
  --c-key:#fb4934; --c-str:#b8bb26; --c-com:#928374; --c-num:#d3869b;
  --c-fn:#83a598; --c-type:#fabd2f; --c-attr:#fe8019;
}
:root{
  --f-sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-serif:Lora,Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--f-sans);
  line-height:1.6;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
input,select,textarea,button{font-family:inherit}

/* ---------- khung chung ---------- */
.topbar{
  border-bottom:1px solid var(--line);background:var(--surface);
  position:sticky;top:0;z-index:50;
}
.topbar .in{max-width:1180px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-serif);font-weight:600;font-size:18px;letter-spacing:-.01em}
.logo .b{color:var(--accent)}
.badge{
  font-family:var(--f-mono);font-size:11px;color:var(--accent);
  background:var(--accent-bg);padding:3px 9px;border-radius:20px;font-weight:600;
}
.spacer{margin-left:auto}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who img{width:24px;height:24px;border-radius:50%;border:1px solid var(--line)}
main{max-width:1180px;margin:0 auto;padding:30px 20px 90px}

/* ---------- nút ---------- */
.btn{
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  padding:8px 15px;border-radius:8px;font-size:13.5px;font-weight:550;cursor:pointer;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{opacity:.88;color:#fff}
.btn.dan{color:var(--danger);border-color:transparent;background:none}
.btn.dan:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:12.5px}

/* ---------- form ---------- */
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
.f{margin-bottom:16px}
.inp{
  width:100%;padding:9px 13px;font-size:14px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--text);outline:none;transition:.15s;
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}
.row{display:grid;gap:14px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}

/* ---------- màn đăng nhập ---------- */
.login{max-width:470px;margin:52px auto}
.card{border:1px solid var(--line);border-radius:14px;padding:28px;background:var(--surface);box-shadow:var(--shadow)}
.login h1{font-family:var(--f-serif);font-size:24px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.login .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.note{
  border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--bg);
  padding:13px 15px;border-radius:0 9px 9px 0;font-size:12.8px;color:var(--muted);line-height:1.6;margin-top:18px;
}
.note b{color:var(--text)}
.err{
  background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger);
  padding:11px 14px;border-radius:8px;font-size:13.2px;margin-bottom:16px;line-height:1.55;
}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:18px}
.chk input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px}

/* ---------- danh sách bài ---------- */
.head{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-family:var(--f-serif);font-size:25px;font-weight:600;letter-spacing:-.01em;margin-right:auto}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.tr{
  display:grid;grid-template-columns:1fr 108px 96px 150px;gap:12px;align-items:center;
  padding:13px 16px;border-bottom:1px solid var(--line);transition:.12s;
}
.tr:last-child{border-bottom:none}
.tr:hover{background:var(--accent-bg)}
.tr.h{background:var(--surface2);font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tr .ti{font-family:var(--f-serif);font-weight:600;font-size:16px;line-height:1.4}
.tr .sl{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:3px}
.tr .cat{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-bg);padding:2px 10px;border-radius:20px;display:inline-block}
.tr .dt{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- thống kê lượt truy cập ---------- */
.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.stat{
  flex:1;min-width:170px;border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;background:var(--surface);box-shadow:var(--shadow);
}
.stat .n{font-family:var(--f-serif);font-size:30px;font-weight:600;line-height:1.1}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:4px}
.st-tbl .tr{grid-template-columns:1fr 92px}
.st-tbl .pth{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:3px}
.st-tbl .num{font-family:var(--f-mono);font-size:14px;text-align:right}
.st-bar{height:4px;border-radius:20px;background:var(--accent);margin-top:6px;min-width:3px}

/* ---------- trình soạn thảo ---------- */
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.pane{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.pane-h{
  background:var(--surface2);border-bottom:1px solid var(--line);padding:8px 13px;
  font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.mdbar{display:flex;gap:3px;flex-wrap:wrap;margin-left:auto}
.mdbtn{
  background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;
  font-family:var(--f-mono);font-size:11.5px;padding:3px 7px;border-radius:5px;transition:.12s;
}
.mdbtn:hover{background:var(--accent-bg);color:var(--accent);border-color:var(--line)}
#body{
  width:100%;min-height:560px;border:none;outline:none;resize:vertical;display:block;
  padding:18px;background:var(--surface);color:var(--text);
  font-family:var(--f-mono);font-size:13.5px;line-height:1.75;
}
/* xem trước dùng đúng kiểu chữ của trang blog để đăng lên không bị lệch */
.prev{
  padding:24px;min-height:560px;overflow-x:auto;background:var(--bg);
  font-family:var(--f-serif);font-size:17px;line-height:1.85;
}
.prev > *:first-child{margin-top:0}
.prev p{margin:20px 0}
.prev h2{font-family:var(--f-sans);font-size:21px;font-weight:700;line-height:1.3;margin:40px 0 13px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.prev h3{font-family:var(--f-sans);font-size:17.5px;font-weight:600;margin:30px 0 9px}
.prev h4{font-family:var(--f-sans);font-size:15.5px;font-weight:600;margin:24px 0 8px}
.prev ul,.prev ol{margin:18px 0;padding-left:25px}
.prev li{margin:8px 0}
.prev li::marker{color:var(--accent)}
.prev blockquote{border-left:3px solid var(--accent);background:var(--accent-bg);padding:13px 18px;margin:24px 0;border-radius:0 10px 10px 0;color:var(--muted);font-style:italic}
.prev blockquote p{margin:0}
.prev blockquote p + p{margin-top:12px}
.prev hr{border:none;border-top:1px solid var(--line);margin:34px 0}
.prev a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.prev strong{font-weight:600}
.prev code{font-family:var(--f-mono);font-size:.82em;background:var(--accent-bg);color:var(--accent);padding:2px 6px;border-radius:5px}
.prev .tw{overflow-x:auto;margin:24px 0;border-radius:10px}
.prev table{width:100%;border-collapse:collapse;font-family:var(--f-sans);font-size:14.5px}
.prev th,.prev td{border:1px solid var(--line);padding:9px 13px;text-align:left}
.prev th{background:var(--surface2);font-weight:600;white-space:nowrap}

/* ảnh / video / biểu đồ — giống hệt trang blog */
.prev figure{margin:26px 0}
.prev figure img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.prev figure video{display:block;max-width:100%;max-height:60vh;width:auto;height:auto;margin:0 auto;border-radius:10px;border:1px solid var(--line);background:#000}
.prev figcaption{font-family:var(--f-sans);font-size:13px;line-height:1.6;color:var(--muted);text-align:center;margin-top:10px;font-style:normal}
.prev p img{display:inline-block;width:auto;max-width:100%;margin:0;vertical-align:middle}
.prev .video{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.prev .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.prev figure.dgm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 16px}
.prev .mermaid{display:block;text-align:center;overflow-x:auto;font-family:var(--f-sans);font-size:14px;line-height:1.5}
.prev .mermaid.dgm-wait{color:transparent}
.prev .mermaid svg{max-width:100%;height:auto}
.prev .mermaid.dgm-err{display:block;color:var(--muted);font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap;text-align:left}

/* kéo-thả ảnh vào ô soạn thảo */
.pane.drop{outline:2px dashed var(--accent);outline-offset:-4px;background:var(--accent-bg)}

.cb{margin:24px 0}
.cb-head{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;padding:5px 13px}
.cb-lang{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cb-copy{background:none;border:none;cursor:pointer;color:var(--muted);font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:5px;transition:.15s}
.cb-copy:hover{background:var(--accent-bg);color:var(--accent)}
.cb pre{background:var(--code-bg);border:1px solid var(--line);border-radius:0 0 10px 10px;padding:15px;overflow-x:auto;margin:0}
.cb pre code{background:none;border:none;color:var(--text);padding:0;font-size:13px;line-height:1.65;font-family:var(--f-mono);display:block}
.hljs-keyword,.hljs-selector-tag,.hljs-literal{color:var(--c-key)}
.hljs-string,.hljs-regexp{color:var(--c-str)}
.hljs-comment,.hljs-quote{color:var(--c-com);font-style:italic}
.hljs-number{color:var(--c-num)}
.hljs-title,.hljs-title.function_,.hljs-section{color:var(--c-fn)}
.hljs-type,.hljs-title.class_,.hljs-built_in{color:var(--c-type)}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-meta{color:var(--c-attr)}

/* ---------- thanh lưu ---------- */
.savebar{
  position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  border-top:1px solid var(--line);padding:12px 20px;z-index:40;
}
.savebar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:11px}
.status{font-size:13px;color:var(--muted);margin-right:auto;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}
.dot.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.dot.err{background:var(--danger)}
@keyframes pulse{50%{opacity:.25}}

.toast{
  position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--accent);color:#fff;padding:10px 20px;border-radius:9px;font-size:14px;
  font-weight:500;opacity:0;transition:.25s;z-index:200;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none !important}

@media(max-width:900px){
  .edit-grid{grid-template-columns:1fr}
  .prev{min-height:auto}
  #body{min-height:340px}
  .tr{grid-template-columns:1fr;gap:7px}
  .tr.h{display:none}
  .acts{justify-content:flex-start}
  .row.c2,.row.c3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="in">
    <span class="logo">Blog <span class="b">cá nhân</span></span>
    <span class="badge">quản trị</span>
    <div class="spacer"></div>
    <div class="who hidden" id="who"></div>
    <button class="btn sm hidden" id="statsBtn" onclick="viewStats()">Lượt truy cập</button>
    <button class="btn sm hidden" id="siteBtn" onclick="window.open('index.html','_blank')">Xem blog ↗</button>
    <button class="btn sm hidden" id="outBtn" onclick="logout()">Đăng xuất</button>
  </div>
</div>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script src="render.js"></script>
<script>
/* =====================================================================
   TRANG QUẢN TRỊ — Blog cá nhân (tung1099.github.io)

   Cơ chế bảo mật: trang này KHÔNG tự kiểm tra mật khẩu. Mọi thao tác
   ghi đều đi qua GitHub API và được chính GitHub xác thực bằng token.
   Không có token hợp lệ với quyền ghi vào repo thì không sửa được gì —
   kể cả khi người khác mở được trang này và xem mã nguồn.
   ===================================================================== */

const API = 'https://api.github.com';
const FILE = 'posts.js';
const DEFAULTS = { owner: 'tung1099', repo: 'tung1099.github.io', branch: 'main' };

let S = {
  token: '', owner: '', repo: '', branch: 'main',
  user: null, posts: [], sha: null,
  editing: null, dirty: false
};

const app  = document.getElementById('app');
const $    = id => document.getElementById(id);
const esc2 = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ------------------------- base64 chuẩn UTF-8 ------------------------- */
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

/* --------------------------- gọi GitHub API --------------------------- */
async function gh(path, opts){
  const r = await fetch(API + path, Object.assign({}, opts, {
    headers: Object.assign({
      'Authorization': 'Bearer ' + S.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, (opts && opts.headers) || {})
  }));
  const text = await r.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){}
  if(!r.ok){
    const msg = (data && data.message) || ('HTTP ' + r.status);
    const err = new Error(msg);
    err.status = r.status;
    throw err;
  }
  return data;
}

/* ------------------------------ lưu trữ ------------------------------ */
const LS = { cfg: 'blog-cfg', token: 'blog-token', theme: 'blog-theme',
             gcCode: 'blog-gc-code', gcToken: 'blog-gc-token' };

/* Dọn cấu hình cũ (gnut-*) còn trỏ về gnutblog.github.io — nó ghi đè lên
   DEFAULTS nên form đăng nhập cứ hiện lại repo cũ. Token thì giữ lại,
   đúng nơi nó đang nằm, để không phải nhập lại. */
function migrateOldSession(){
  try{
    const oldLocal = localStorage.getItem('gnut-token');
    const oldSess  = sessionStorage.getItem('gnut-token');
    if(oldLocal && !localStorage.getItem(LS.token))   localStorage.setItem(LS.token, oldLocal);
    if(oldSess  && !sessionStorage.getItem(LS.token)) sessionStorage.setItem(LS.token, oldSess);
    ['gnut-cfg','gnut-token'].forEach(k => { localStorage.removeItem(k); sessionStorage.removeItem(k); });
  }catch(e){}
}

function saveSession(remember){
  const cfg = JSON.stringify({ owner: S.owner, repo: S.repo, branch: S.branch });
  try{
    localStorage.setItem(LS.cfg, cfg);
    (remember ? localStorage : sessionStorage).setItem(LS.token, S.token);
    if(!remember) localStorage.removeItem(LS.token);
  }catch(e){}
}
function loadSession(){
  migrateOldSession();
  try{
    const cfg = JSON.parse(localStorage.getItem(LS.cfg) || 'null');
    if(cfg) Object.assign(S, cfg);
    S.token = localStorage.getItem(LS.token) || sessionStorage.getItem(LS.token) || '';
  }catch(e){}
}
function logout(){
  if(S.dirty && !confirm('Bài đang soạn chưa đăng sẽ mất. Vẫn đăng xuất?')) return;
  try{ localStorage.removeItem(LS.token); sessionStorage.removeItem(LS.token); }catch(e){}
  S = { token:'', owner:S.owner, repo:S.repo, branch:S.branch, user:null, posts:[], sha:null, editing:null, dirty:false };
  document.querySelectorAll('#who,#outBtn,#siteBtn,#statsBtn').forEach(e => e.classList.add('hidden'));
  viewLogin();
}

/* ============================ MÀN ĐĂNG NHẬP ============================ */
function viewLogin(err){
  loadSession();
  app.innerHTML =
  '<div class="login"><div class="card">'
  + '<h1>Đăng nhập</h1>'
  + '<div class="sub">Xác thực bằng GitHub. Chỉ tài khoản có quyền ghi vào repo mới thêm/sửa/xoá được bài.</div>'
  + (err ? '<div class="err">' + esc2(err) + '</div>' : '')
  + '<div class="row c2">'
    + '<div class="f"><label>Tài khoản GitHub</label><input class="inp" id="i-owner" value="' + esc2(S.owner || DEFAULTS.owner) + '"></div>'

  + '<button class="btn pri" style="width:100%;padding:11px" id="loginBtn" onclick="doLogin()">Đăng nhập</button>'

async function doLogin(){
  const btn = $('loginBtn');
  S.owner  = $('i-owner').value.trim();
  S.repo   = $('i-repo').value.trim();
  S.branch = $('i-branch').value.trim() || 'main';
  S.token  = $('i-token').value.trim();

  if(!S.owner || !S.repo || !S.token) return viewLogin('Điền đủ tài khoản, repository và token.');

  btn.disabled = true; btn.textContent = 'Đang kiểm tra…';
  try{
    S.user = await gh('/user');

    const repo = await gh('/repos/' + S.owner + '/' + S.repo);
    if(!repo.permissions || !repo.permissions.push){
      throw new Error('Tài khoản ' + S.user.login + ' không có quyền ghi vào ' + S.owner + '/' + S.repo + '.');
    }

    await loadPosts();
    saveSession($('i-remember').checked);
    showUser();
    viewList();
    toast('Xin chào ' + S.user.login);
  }catch(e){
    let m = e.message;
    if(e.status === 401) m = 'Token không hợp lệ hoặc đã hết hạn.';
    if(e.status === 404) m = 'Không tìm thấy repo ' + S.owner + '/' + S.repo + '. Kiểm tra lại tên, hoặc token chưa được cấp quyền cho repo này.';
    viewLogin(m);
  }
}

function showUser(){
  $('who').innerHTML = '<img src="' + esc2(S.user.avatar_url) + '" alt=""><span>'
    + esc2(S.user.login) + ' · ' + esc2(S.owner + '/' + S.repo) + '</span>';
  document.querySelectorAll('#who,#outBtn,#siteBtn,#statsBtn').forEach(e => e.classList.remove('hidden'));
}

/* ============================ ĐỌC / GHI DỮ LIỆU ============================ */
async function loadPosts(){
  try{
    const f = await gh('/repos/' + S.owner + '/' + S.repo + '/contents/' + FILE + '?ref=' + encodeURIComponent(S.branch));
    S.sha = f.sha;
    const raw = b64decode(f.content);
    const m = /window\.POSTS\s*=\s*([\s\S]*?);?\s*$/.exec(raw.trim());
    S.posts = m ? JSON.parse(m[1]) : [];
  }catch(e){
    if(e.status === 404){ S.posts = []; S.sha = null; }   // chưa có file, sẽ tạo mới khi đăng
    else throw e;
  }
}

async function commit(message){
  const content = 'window.POSTS = ' + JSON.stringify(S.posts, null, 2) + ';\n';
  const body = {
    message: message,
    content: b64encode(content),
    branch: S.branch
  };
  if(S.sha) body.sha = S.sha;
  const r = await gh('/repos/' + S.owner + '/' + S.repo + '/contents/' + FILE, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  S.sha = r.content.sha;
  return r;
}

function setStatus(cls, text){
  const el = $('status');
  if(el) el.innerHTML = '<span class="dot ' + cls + '"></span><span>' + esc2(text) + '</span>';
}

async function publish(message, after){
  setStatus('busy', 'Đang đẩy lên GitHub…');
  try{
    await commit(message);
    S.dirty = false;
    setStatus('ok', 'Đã đăng. GitHub Pages cập nhật sau khoảng 1 phút.');
    toast('Đã đăng lên web');
    if(after) after();
  }catch(e){
    if(e.status === 409){
      setStatus('err', 'File đã bị sửa ở nơi khác. Tải lại rồi thử lại.');
    }else{
      setStatus('err', 'Lỗi: ' + e.message);
    }
    toast('Không đăng được');
  }
}

/* ======================= LƯỢT TRUY CẬP (GoatCounter) =======================
   GitHub Pages là hosting tĩnh nên không tự đếm được; số liệu lấy từ API của
   GoatCounter. API của họ có CORS (Access-Control-Allow-Origin: *) nên gọi
   thẳng từ đây được, không cần máy chủ trung gian.

   Khoá API lưu trong localStorage giống token GitHub. Hãy tạo khoá chỉ với
   quyền "Read statistics" — nó không sửa được gì, và cũng không đụng tới repo.
   ========================================================================= */
const GC = {
  get code(){ return localStorage.getItem(LS.gcCode) || ''; },
  get token(){ return localStorage.getItem(LS.gcToken) || ''; },
  save(code, token){
    localStorage.setItem(LS.gcCode, code.trim());
    localStorage.setItem(LS.gcToken, token.trim());
  },
  clear(){ localStorage.removeItem(LS.gcCode); localStorage.removeItem(LS.gcToken); }
};

async function gcGet(path, params){
  const qs = new URLSearchParams(params || {}).toString();
  const r = await fetch('https://' + GC.code + '.goatcounter.com/api/v0' + path + (qs ? '?' + qs : ''), {
    headers: { 'Authorization': 'Bearer ' + GC.token, 'Content-Type': 'application/json' }
  });
  if(!r.ok){
    const t = await r.text().catch(() => '');
    const e = new Error(r.status === 401 || r.status === 403
      ? 'Khoá API bị từ chối. Kiểm tra lại mã site và khoá.'
      : 'GoatCounter trả về ' + r.status + ' ' + t.slice(0, 120));
    e.status = r.status;
    throw e;
  }
  return r.json();
}

function saveStatsCfg(){
  const code = $('gc-code').value.trim(), token = $('gc-token').value.trim();
  if(!code || !token) return viewStatsSetup('Điền đủ mã site và khoá API.');
  GC.save(code, token);
  viewStats();
}

/* Đổi đường dẫn GoatCounter ghi được thành tiêu đề bài cho dễ đọc */
function labelFor(path){
  const m = /^\/post\/(.+)$/.exec(path);
  if(m){
    const p = S.posts.find(x => x.id === m[1]);
    if(p) return p.title;
  }
  if(path === '/' || path === '') return 'Trang chủ';
  if(path === '/about')           return 'Giới thiệu';
  const c = /^\/category\/(.+)$/.exec(path);
  if(c) return 'Chuyên mục: ' + c[1];
  return path;
}

const DAYS = [7, 30, 365];
let statsDays = 30;

async function viewStats(days){
  if(days) statsDays = days;
  if(!GC.code || !GC.token) return viewStatsSetup();

  app.innerHTML =
    '<div class="head"><h1>Lượt truy cập</h1>'
    + '<button class="btn sm" onclick="viewList()">← Về danh sách bài</button></div>'
    + '<div class="empty">Đang tải số liệu…</div>';

  const start = new Date(Date.now() - statsDays * 864e5).toISOString().slice(0, 10);
  try{
    const [tot, hits] = await Promise.all([
      gcGet('/stats/total', { start: start }),
      gcGet('/stats/hits',  { start: start, limit: 50 })
    ]);

    const rows = (hits.hits || []).slice().sort((a, b) => b.count - a.count);
    const max  = rows.length ? rows[0].count : 1;
    const posts = rows.filter(h => h.path.startsWith('/post/'));

    app.innerHTML =
      '<div class="head"><h1>Lượt truy cập</h1>'
      + DAYS.map(d => '<button class="btn sm' + (d === statsDays ? ' pri' : '') + '" onclick="viewStats(' + d + ')">'
          + (d === 365 ? '1 năm' : d + ' ngày') + '</button>').join('')
      + '<button class="btn sm" onclick="viewStatsSetup()">Cấu hình</button>'
      + '<button class="btn sm" onclick="viewList()">← Về danh sách bài</button></div>'

      + '<div class="stat-row">'
        + '<div class="stat"><div class="n">' + (tot.total || 0).toLocaleString('vi-VN') + '</div>'
          + '<div class="k">lượt truy cập, ' + statsDays + ' ngày qua</div></div>'
        + '<div class="stat"><div class="n">' + posts.reduce((a, h) => a + h.count, 0).toLocaleString('vi-VN') + '</div>'
          + '<div class="k">lượt đọc bài viết</div></div>'
        + '<div class="stat"><div class="n">' + posts.length + '</div>'
          + '<div class="k">bài có người đọc</div></div>'
      + '</div>'

      + (rows.length
        ? '<div class="tbl st-tbl"><div class="tr h"><div>Trang</div><div style="text-align:right">Lượt</div></div>'
          + rows.map(h =>
              '<div class="tr"><div><div class="ti" style="font-size:15px">' + esc2(labelFor(h.path)) + '</div>'
              + '<div class="pth">' + esc2(h.path) + '</div>'
              + '<div class="st-bar" style="width:' + Math.max(3, Math.round(h.count / max * 100)) + '%"></div></div>'
              + '<div class="num">' + h.count.toLocaleString('vi-VN') + '</div></div>').join('')
          + '</div>'
        : '<div class="tbl"><div class="empty">Chưa có lượt truy cập nào trong khoảng này.<br><br>'
          + 'Nếu bạn vừa gắn bộ đếm thì chờ vài phút, và nhớ kiểm tra <code>SITE.goatcounter</code> '
          + 'trong <code>index.html</code> đã điền mã site chưa.</div></div>')

      + '<div class="note" style="margin-top:18px">Số liệu do GoatCounter đếm phía trình duyệt nên '
      + '<b>thấp hơn thực tế</b> — khách dùng trình chặn quảng cáo sẽ không được tính. '
      + 'Xem đầy đủ tại <a href="https://' + esc2(GC.code) + '.goatcounter.com" target="_blank" rel="noopener">'
      + esc2(GC.code) + '.goatcounter.com ↗</a></div>';
  }catch(e){
    viewStatsSetup(e.message);
  }
}

async function reload(){
  setStatus('busy', 'Đang tải lại…');
  try{ await loadPosts(); viewList(); toast('Đã tải lại'); }
  catch(e){ setStatus('err', 'Lỗi: ' + e.message); }
}

async function removePost(id){
  const p = S.posts.find(x => x.id === id);
  if(!p) return;
  if(!confirm('Xoá vĩnh viễn bài "' + p.title + '"?\n\nThao tác này tạo một commit trên GitHub, vẫn khôi phục được từ lịch sử.')) return;
  S.posts = S.posts.filter(x => x.id !== id);
  viewList();
  publish('xoá bài: ' + p.title, viewList);
}

const CATS   = ['Code', 'Cuộc sống'];
const TOPICS = ['Java core', 'Spring', 'Database & SQL', 'Kafka', 'Redis', 'Bảo mật',
                'Docker & CI/CD', 'Mạng máy tính', 'Hiệu năng', 'Công cụ', 'AI ứng dụng',
                'AI Agent', 'Microservices'];

/* <option> có sẵn giá trị đang dùng kể cả khi nó không nằm trong danh sách */
function opts(list, current, emptyLabel){
  const all = list.concat(current && list.indexOf(current) === -1 ? [current] : []);
  return (emptyLabel ? '<option value=""' + (current ? '' : ' selected') + '>— ' + emptyLabel + ' —</option>' : '')
    + all.map(v => '<option value="' + esc2(v) + '"' + (v === current ? ' selected' : '') + '>' + esc2(v) + '</option>').join('');
}

function editPost(id){
  const p = id ? S.posts.find(x => x.id === id) : null;
  S.editing = p ? JSON.parse(JSON.stringify(p)) : {
    id: '', title: '', date: new Date().toISOString().slice(0,10),
    category: 'Code', topic: '', tags: [], summary: '', body: ''
  };
  S.editing._orig = id || null;
  S.dirty = false;
  renderEditor();
}

  const pane = ta.closest('.pane');
  $('filePick').addEventListener('change', ev => {
    uploadFiles(ev.target.files);
    ev.target.value = '';
  });
  ['dragenter','dragover'].forEach(k => ta.addEventListener(k, ev => {
    if(!ev.dataTransfer || ev.dataTransfer.types.indexOf('Files') === -1) return;
    ev.preventDefault(); pane.classList.add('drop');
  }));
  ['dragleave','dragend'].forEach(k => ta.addEventListener(k, () => pane.classList.remove('drop')));
  ta.addEventListener('drop', ev => {
    if(!ev.dataTransfer || !ev.dataTransfer.files.length) return;
    ev.preventDefault(); pane.classList.remove('drop');
    ta.focus();
    uploadFiles(ev.dataTransfer.files);
  });
  ta.addEventListener('paste', ev => {
    const files = Array.prototype.slice.call((ev.clipboardData || {}).files || []);
    if(!files.length) return;
    ev.preventDefault();
    uploadFiles(files);
  });

  renderPreview();
  window.scrollTo(0,0);
}

function renderPreview(){
  const html = md($('body').value);
  $('prev').innerHTML = html || '<span style="color:var(--muted)">Xem trước sẽ hiện ở đây.</span>';
  highlightAll('.prev');
  renderMermaid('.prev');
  showLocalImages();
}

/* =====================================================================
   TẢI ẢNH / VIDEO LÊN REPO
   Ảnh được commit vào images/<năm>/ rồi chèn vào bài dưới dạng đường dẫn
   tương đối — chạy đúng cả trên blog lẫn ở đây vì cả hai đều ở thư mục gốc.
   ===================================================================== */
const MAX_UPLOAD = 5 * 1024 * 1024;
const EXT_BY_TYPE = {
  'image/png':'.png', 'image/jpeg':'.jpg', 'image/gif':'.gif', 'image/webp':'.webp',
  'image/svg+xml':'.svg', 'image/avif':'.avif', 'video/mp4':'.mp4', 'video/webm':'.webm'
};
/* ảnh vừa tải lên chưa kịp publish lên GitHub Pages (~1 phút), nên xem trước
   tạm dùng bản dataURL còn trong bộ nhớ */
const LOCAL_IMG = {};

const fileToBase64 = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload  = () => res(String(r.result).split(',')[1]);
  r.onerror = () => rej(new Error('không đọc được file'));
  r.readAsDataURL(f);
});
const fileToDataURL = f => new Promise(res => {
  const r = new FileReader();
  r.onload  = () => res(String(r.result));
  r.onerror = () => res('');
  r.readAsDataURL(f);
});

async function uploadFiles(fileList){
  const files = Array.prototype.slice.call(fileList || [])
    .filter(f => /^(image|video)\//.test(f.type));
  if(!files.length) return toast('Chỉ nhận file ảnh hoặc video');
  for(const f of files) await uploadOne(f);
}

async function uploadOne(file){
  if(file.size > MAX_UPLOAD){
    setStatus('err', 'File "' + file.name + '" nặng ' + (file.size/1048576).toFixed(1) + 'MB, quá mức 5MB. Nén nhỏ lại đã.');
    return toast('File quá nặng');
  }
  const ext  = (/\.[a-z0-9]+$/i.exec(file.name) || [EXT_BY_TYPE[file.type] || ''])[0].toLowerCase();
  const base = slugify(file.name.replace(/\.[^.]+$/, '')) || 'anh';
  const path = 'images/' + new Date().getFullYear() + '/' + base + '-' + Date.now().toString(36) + ext;

  setStatus('busy', 'Đang tải ' + file.name + ' lên GitHub…');
  try{
    const content = await fileToBase64(file);
    await gh('/repos/' + S.owner + '/' + S.repo + '/contents/' + path, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'thêm ảnh: ' + path, content: content, branch: S.branch })
    });
    LOCAL_IMG[path] = await fileToDataURL(file);
    insertAtCursor('\n![](' + path + ')\n');
    setStatus('ok', 'Đã tải lên ' + path + ' — viết chú thích vào trong cặp ngoặc ![...] nếu muốn.');
    toast('Đã chèn ' + (/^video\//.test(file.type) ? 'video' : 'ảnh'));
  }catch(e){
    setStatus('err', 'Không tải được "' + file.name + '": ' + e.message);
    toast('Tải lên thất bại');
  }
}

/* đổi src của ảnh vừa upload sang dataURL để xem trước không bị vỡ */
function showLocalImages(){
  document.querySelectorAll('#prev img, #prev video').forEach(el => {
    const src = el.getAttribute('src') || '';
    if(LOCAL_IMG[src]) el.src = LOCAL_IMG[src];
  });
}

function pickFile(){ $('filePick').click(); }

function insertAtCursor(text){
  const ta = $('body');
  const s = ta.selectionStart, e2 = ta.selectionEnd;
  ta.setRangeText(text, s, e2, 'end');
  ta.focus();
  renderPreview();
  S.dirty = true;
}

function insertVideo(){
  const url = prompt('Dán link YouTube hoặc Vimeo:\n(ví dụ https://youtu.be/xxxx — có ?t=90 thì video tự tua tới giây 90)');
  if(!url) return;
  const u = url.trim();
  if(!/^https?:\/\/\S+$/.test(u)) return toast('Link không hợp lệ');
  insertAtCursor('\n' + u + '\n');
}

function insertDiagram(){
  insertAtCursor('\n```mermaid\nflowchart LR\n  A[Client] --> B[Spring Boot]\n  B --> C[(PostgreSQL)]\n  B --> D[(Redis)]\n```\n');
}

/* ----- công cụ chèn Markdown ----- */
function wrap(a, b){
  const ta = $('body');
  const s = ta.selectionStart, e2 = ta.selectionEnd;
  const sel = ta.value.slice(s, e2);
  ta.setRangeText(a + sel + b, s, e2, sel ? 'end' : 'select');
  if(!sel) ta.setSelectionRange(s + a.length, s + a.length);
  ta.focus(); renderPreview(); S.dirty = true;
}
function pre(p){
  const ta = $('body');
  const s = ta.selectionStart;
  const ls = ta.value.lastIndexOf('\n', s - 1) + 1;
  ta.setRangeText(p, ls, ls, 'end');
  ta.focus(); renderPreview(); S.dirty = true;
}
function block(lang){
  const ta = $('body');
  const s = ta.selectionStart, e2 = ta.selectionEnd;
  const sel = ta.value.slice(s, e2);
  ta.setRangeText('\n```' + lang + '\n' + (sel || '') + '\n```\n', s, e2, 'end');
  ta.focus(); renderPreview(); S.dirty = true;
}

function cancelEdit(){
  if(S.dirty && !confirm('Thay đổi chưa đăng sẽ mất. Quay lại?')) return;
  S.editing = null; S.dirty = false;
  viewList();
}

function savePost(){
  const e = S.editing;
  const title = $('f-title').value.trim();
  let id = $('f-id').value.trim() || slugify(title);

  if(!title) return toast('Chưa có tiêu đề');
  if(!id)    return toast('Chưa có đường dẫn (slug)');
  if(!$('body').value.trim()) return toast('Bài chưa có nội dung');

  const duplicate = S.posts.some(p => p.id === id && p.id !== e._orig);
  if(duplicate) return toast('Đường dẫn "' + id + '" đã có bài khác dùng');

  const post = {
    id: id,
    title: title,
    date: $('f-date').value || new Date().toISOString().slice(0,10),
    category: $('f-cat').value
  };
  /* để trống thì không ghi field vào file cho gọn */
  if($('f-topic').value) post.topic = $('f-topic').value;
  post.tags    = $('f-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  post.summary = $('f-sum').value.trim();
  post.body    = $('body').value;

  const isNew = !e._orig;
  if(isNew){
    S.posts.unshift(post);
  }else{
    const i = S.posts.findIndex(p => p.id === e._orig);
    S.posts[i] = post;
  }
  e._orig = id;
  $('pubBtn').disabled = true;

  publish((isNew ? 'bài mới: ' : 'sửa bài: ') + title, () => {
    $('pubBtn').disabled = false;
    setTimeout(() => { S.editing = null; viewList(); }, 900);
  });
  setTimeout(() => { const b = $('pubBtn'); if(b) b.disabled = false; }, 4000);
}

/* ============================ KHỞI ĐỘNG ============================ */
window.addEventListener('beforeunload', ev => {
  if(S.dirty){ ev.preventDefault(); ev.returnValue = ''; }
});

(async function init(){
  try{
    document.documentElement.setAttribute('data-theme',
      localStorage.getItem(LS.theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }

  loadSession();
  if(S.token && S.owner && S.repo){
    try{
      S.user = await gh('/user');
      await loadPosts();
      showUser();
      viewList();
      return;
    }catch(e){ /* token hỏng hoặc hết hạn → về màn đăng nhập */ }
  }
  viewLogin();
})();
</script>
